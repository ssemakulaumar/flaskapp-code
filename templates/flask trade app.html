<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        main {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
        }
        #chart {
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Trading Statistics Dashboard</h1>
    </header>
    <main>
        <h2>Market Trends and Trades</h2>
        <div id="chart">
            <img id="trade-chart" src="" alt="Market Trends" />
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button onclick="fetchVisualization()">Refresh Chart</button>
        </div>
    </main>

    <script>
        async function fetchVisualization() {
            try {
                const response = await fetch('/api/visualize');
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('trade-chart').src = data.image;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error fetching visualization:', error);
                alert('An error occurred while fetching the visualization.');
            }
        }

        // Fetch the chart on page load
        fetchVisualization();
    </script>
</body>
</html>
